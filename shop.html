<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Top Up Game — Leo Store</title>

  <meta
    name="description"
    content="Top up game cepat, mudah, dan praktis di Leo Store."
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">

    <div class="container">

      <a href="index.html" class="logo">
        Leo Store
      </a>

      <nav class="main-nav">

        <a href="index.html">
          Home
        </a>

        <a href="shop.html" class="active">
          Top Up
        </a>

        <a href="order.html">
          Cek Pesanan
        </a>

      </nav>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>

    <section class="shop-page">

      <div class="container">

        <!-- PAGE TITLE -->

        <div class="shop-heading">

          <span class="eyebrow">
            LEO STORE
          </span>

          <h1>
            Top Up Game
          </h1>

          <p>
            Pilih game yang ingin kamu top up.
          </p>

        </div>


        <!-- SEARCH -->

        <div class="shop-search">

          <span>
            🔎
          </span>

          <input
            type="search"
            id="shopSearch"
            placeholder="Cari game..."
            autocomplete="off"
          >

        </div>


        <!-- PRODUCT LIST -->

        <section
          id="productList"
          class="product-list"
          aria-live="polite"
        >

          <div class="shop-empty">

            <div class="shop-empty-icon">
              ⏳
            </div>

            <h3>
              Memuat produk...
            </h3>

            <p>
              Tunggu sebentar.
            </p>

          </div>

        </section>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer">

    <div class="container">

      <p>
        Leo Store
      </p>

      <span>
        © 2026 Leo Store
      </span>

    </div>

  </footer>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="js/products.js"></script>
  <script src="js/shop.js"></script>

</body>

</html>
