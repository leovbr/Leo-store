<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Top Up Game — LEOOSTORE</title>

  <meta
    name="description"
    content="Pilih game dan nominal top up di LEOOSTORE."
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >
  <link rel="stylesheet" href="css/style-pages.css">

</head>


<body class="shop-page">


  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="container">

      <a
  href="index.html"
  class="header-brand"
>
  <img
    src="assets/logo-1.webp"
    alt="LEOOSTORE"
    class="header-logo"
  >

  <span class="header-brand-text">
    LEOOSTORE
  </span>
</a>


      <nav class="nav">

        <a href="index.html">
          Home
        </a>

        <a
          href="shop.html"
          class="active"
        >
          Top Up
        </a>

        <a href="order.html">
          Cek Pesanan
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <section class="shop-section">

      <div class="container">


        <div class="section-heading">

          <span class="eyebrow">
            LEOOSTORE
          </span>

          <h1>
            Top Up Game
          </h1>

          <p>
            Pilih game favoritmu untuk melanjutkan top up.
          </p>

        </div>


        <!-- SEARCH -->

        <div class="shop-search-wrap">

          <label
            for="shopSearch"
            class="sr-only"
          >
            Cari game
          </label>

          <input
            type="search"
            id="shopSearch"
            class="shop-search"
            placeholder="Cari nama game..."
            autocomplete="off"
          >

        </div>


        <!-- PRODUCT LIST -->

        <div
          id="productList"
          class="product-grid"
        >

          <div class="empty-state">

            <strong>
              Memuat game...
            </strong>

            <span>
              Tunggu sebentar.
            </span>

          </div>

        </div>


      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer">

    <div class="container">

      <div>

        <strong>
          LEOOSTORE
        </strong>

        <span>
          © 2026 LEOOSTORE
        </span>

      </div>

    </div>

  </footer>


  <!-- =========================
       DATA + SHOP
  ========================== -->

  <script src="js/products.js"></script>

  <script src="js/shop.js"></script>


</body>

</html>
