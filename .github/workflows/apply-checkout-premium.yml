name: Apply checkout premium stylesheet

on:
  push:
    paths:
      - "css/checkout-premium.css"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add checkout stylesheet
        shell: python
        run: |
          from pathlib import Path
          p = Path("checkout.html")
          text = p.read_text(encoding="utf-8")
          link = '  <link rel="stylesheet" href="css/checkout-premium.css?v=20260918-1">\n'
          if "css/checkout-premium.css" not in text:
              marker = '  <link\n    rel="stylesheet"\n    href="css/style-pages.css?v=20260914-10"\n  >\n'
              if marker not in text:
                  raise SystemExit("checkout stylesheet marker not found")
              text = text.replace(marker, marker + "\n" + link, 1)
              p.write_text(text, encoding="utf-8")

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkout.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "style: apply premium checkout mobile design"
          git push
