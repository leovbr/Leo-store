 value="draft">Draf</option><option value="published">Publikasikan</option></select></label><label class="adm-full">Gambar thumbnail (opsional)<input id="thumbnail" type="url" placeholder="URL gambar atau pilih dari perpustakaan"><select id="thumbnailPicker" style="margin-top:7px"><option value="">Pilih gambar dari perpustakaan…</option></select><div class="library-preview" id="thumbnailPreview"><span class="adm-small">Belum ada gambar dipilih.</span></div><input id="thumbnailFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" style="margin-top:8px"><button class="adm-btn secondary" type="button" id="uploadThumbnail" style="margin-top:8px">Upload ke perpustakaan gambar</button></label><label class="adm-full">URL sumber / berita asli (opsional)<input id="sourceUrl" type="url" placeholder="https://website-berita-esports.com/artikel"><span class="adm-small">Masukkan tautan sumber jika artikel merujuk berita atau panduan dari website lain.</span></label><label class="adm-full">Ringkasan<input id="excerpt" maxlength="300" placeholder="Ringkasan singkat yang tampil di daftar artikel"></label><label class="adm-full">Isi artikel<textarea id="content" placeholder="Opsional. Tulis isi artikel di sini jika ingin menambahkan penjelasan."></textarea><span class="adm-small">Opsional. Jika dikosongkan, artikel tetap bisa diterbitkan dengan judul, ringkasan, dan tautan sumber. Teks biasa; HTML tidak diproses sebagai kode.</span></label><div class="adm-full adm-actions"><button class="adm-btn" type="submit">Simpan artikel</button><button class="adm-btn secondary" type="button" id="resetForm">Artikel baru / batal edit</button></div></form></section><section class="adm-panel" id="listPanel" hidden><h2>Daftar artikel</h2><div id="articleList" class="adm-list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const $=id=>document.getElementById(id),status=$("status");const menuToggle=$("adminMenuToggle"),menu=$("adminMenu");if(menuToggle&&menu){menuToggle.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();const open=!menu.classList.contains("open");menu.classList.toggle("open",open);menuToggle.setAttribute("aria-expanded",String(open));});document.addEventListener("click",e=>{if(!e.target.closest(".admin-header-actions")){menu.classList.remove("open");menuToggle.setAttribute("aria-expanded","false");}});menu.addEventListener("click",e=>e.stopPropagation());}if(!window.supabase||!window.supabase.createClient){status.textContent="Gagal memuat Supabase SDK. Muat ulang halaman dan periksa koneksi.";return;}let db;try{db=window.supabase.createClient("https://tvdbrqskvuukxvqaqjom.supabase.co","sb_publishable_2f-IadmcnaYzoCb_8Iko0w_pFp9u8eF");}catch(err){status.textContent="Inisialisasi Supabase gagal: "+(err.message||err);return;}let user=null;const say=s=>status.textContent=s;const slugify=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");$("title").addEventListener("input",()=>{if(!$("articleId").value||!$("slug").dataset.touched)$("slug").value=slugify($("title").value)});$("slug").addEventListener("input",()=>{$("slug").dataset.touched="1";$("slug").value=slugify($("slug").value)});function reset(){ $("articleForm").reset();$("articleId").value="";$("slug").dataset.touched="";$("formTitle").textContent="Tambah artikel";} $("resetForm").onclick=reset;async function load(){const {data,error}=await db.from("store_articles").select("*").order("updated_at",{ascending:false});if(error){$("articleList").textContent="Gagal memuat artikel: "+error.message;return;}const rows=data||[];$("articleList").innerHTML=rows.length?rows.map(a=>'<div class="adm-item"><div class="adm-article-summary">' +(a.thumbnail_url?'<img class="adm-article-thumb" src="'+escapeHtml(a.thumbnail_url)+'" alt="Preview '+escapeHtml(a.title)+'" loading="lazy" onerror="this.hidden=true">' : '<div class="adm-article-thumb adm-article-thumb-empty">Tidak ada foto</div>')+'<div class="adm-article-text"><strong>'+escapeHtml(a.title)+'</strong><p>'+escapeHtml(a.category)+' · '+escapeHtml(a.status)+' · /artikel-detail.html?slug='+escapeHtml(a.slug)+'</p></div></div><div class="adm-item-actions"><button class="adm-btn secondary" data-edit="'+a.id+'">Edit</button><button class="adm-btn secondary" data-toggle="'+a.id+'">'+(a.status==="published"?"Jadikan draf":"Publikasikan")+'</button><button class="adm-btn secondary" data-delete="'+a.id+'">Hapus</button></div></div>').join(""):'Belum ada artikel.'}function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));} $("articleForm").onsubmit=async e=>{e.preventDefault();const form=$("articleForm"),saveButton=form.querySelector('button[type="submit"]');if(saveButton.disabled)return;const title=$("title").value.trim();const slug=slugify($("slug").value.trim()||title);if(!title){say("Gagal menyimpan: judul artikel wajib diisi.");$("title").focus();return;}if(!slug){say("Gagal menyimpan: judul tidak menghasilkan slug URL yang valid. Gunakan huruf Latin dan angka.");$("slug").focus();return;}if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)){say("Gagal menyimpan: slug hanya boleh berisi huruf kecil, angka, dan tanda hubung.");$("slug").focus();return;}saveButton.disabled=true;const originalLabel=saveButton.textContent;saveButton.textContent="Menyimpan…";try{const articleId=$("articleId").value;const payload={title,slug,source_url:$("sourceUrl").value.trim()||null,category:$("category").value,status:$("articleStatus").value,thumbnail_url:$("thumbnail").value.trim()||null,excerpt:$("excerpt").value.trim(),content:$("content").value.trim(),updated_at:new Date().toISOString(),author_id:user.id};if(payload.status==="published"){payload.published_at=new Date().toISOString();if(articleId){const previous=await db.from("store_articles").select("published_at").eq("id",articleId).maybeSingle();if(!previous.error&&previous.data&&previous.data.published_at)payload.published_at=previous.data.published_at;}}else{payload.published_at=null;}let result;if(articleId){result=await db.from("store_articles").update(payload).eq("id",articleId);}else{result=await db.from("store_articles").insert(payload);}if(result.error){const err=result.error;let message=err.message||"Error tidak diketahui";if(err.code==="23505")message="Slug sudah dipakai artikel lain. Ubah judul atau slug.";else if(err.code==="23503")message="Referensi akun penulis tidak valid. Coba keluar lalu login kembali.";else if(err.code==="42501"||/row-level security|permission denied/i.test(message))message="Ditolak oleh izin Supabase (RLS). Pastikan sesi login dan policy INSERT/UPDATE mengizinkan author_id = auth.uid(). Detail: "+message;else if(/column .* does not exist|schema cache/i.test(message))message="Kolom tabel store_articles belum sesuai dengan form. Periksa skema tabel dan muat ulang schema cache. Detail: "+message;say("Gagal menyimpan artikel: "+message+(err.details?" — "+err.details:"")+(err.hint?" (Petunjuk: "+err.hint+")":""));return;}say("Artikel berhasil disimpan sebagai "+(payload.status==="published"?"publikasi":"draf")+".");reset();await load();}catch(err){say("Terjadi kesalahan saat menyimpan artikel: "+(err&&err.message?err.message:String(err)));}finally{saveButton.disabled=false;saveButton.textContent=originalLabel;}};$("articleList").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.edit||b.dataset.toggle||b.dataset.delete;if(!id)return;const {data,error}=await db.from("store_articles").select("*").eq("id",id).single();if(error){say(error.message);return;}if(b.dataset.edit){$("articleId").value=data.id;$("title").value=data.title;$("slug").value=data.slug;$("slug").dataset.touched="1";$("category").value=data.category;$("articleStatus").value=data.status;$("thumbnail").value=data.thumbnail_url||"";$("sourceUrl").value=data.source_url||"";$("excerpt").value=data.excerpt||"";$("content").value=data.content||"";$("formTitle").textContent="Edit artikel";window.scrollTo({top:0,behavior:"smooth"});return;}if(b.dataset.delete){if(!confirm("Hapus artikel ini secara permanen?"))return;const {error:delErr}=await db.from("store_articles").delete().eq("id",id);if(delErr){say(delErr.message);return;}say("Artikel dihapus.");await load();return;}const next=data.status==="published"?"draft":"published";const {error:upErr}=await db.from("store_articles").update({status:next,published_at:next==="published"?(data.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()}).eq("id",id);if(upErr){say(upErr.message);return;}say("Status artikel diperbarui.");await load();};$("signOut").onclick=async()=>{await db.auth.signOut();location.href="index.html"};db.auth.getSession().then(async({data,error})=>{if(error||!data.session){say("Silakan login melalui Supabase Auth sebelum mengelola artikel.");return;}user=data.session.user;$("editor").hidden=false;$("listPanel").hidden=false;say("Siap mengelola artikel.");await Promise.all([load(),loadThumbnailLibrary()]);});

async function loadThumbnailLibrary(){const picker=$("thumbnailPicker");picker.innerHTML='<option value="">Memuat perpustakaan gambar…</option>';try{const {data,error}=await db.from("store_images").select("image_key,image_url").order("image_key");if(error)throw error;const rows=(data||[]).filter(x=>x.image_url);picker.innerHTML='<option value="">'+(rows.length?"Pilih gambar dari perpustakaan…":"Belum ada gambar di perpustakaan")+"</option>"+rows.map(x=>'<option value="'+escapeHtml(x.image_url)+'">'+escapeHtml(x.image_key)+'</option>').join("");if(!rows.length)say("Perpustakaan gambar kosong. Upload gambar baru atau periksa izin SELECT tabel store_images.");return;}catch(e){picker.innerHTML='<option value="">Gagal memuat perpustakaan</option>';say("Gagal memuat perpustakaan gambar: "+(e.message||e));}}
function showThumbnail(url){$("thumbnailPreview").innerHTML=url?'<img src="'+escapeHtml(url)+'" alt="Preview thumbnail"><span class="adm-small">Preview gambar artikel</span>':'<span class="adm-small">Belum ada gambar dipilih.</span>';}
$("thumbnailPicker").onchange=()=>{const url=$("thumbnailPicker").value;if(url){$("thumbnail").value=url;showThumbnail(url);say("Gambar dipilih. Preview ditampilkan; simpan artikel untuk menerapkannya.");}};$("thumbnail").addEventListener("input",()=>showThumbnail($("thumbnail").value));
$("uploadThumbnail").addEventListener("click",async e=>{e.preventDefault();e.stopPropagation();const btn=$("uploadThumbnail");if(btn.dataset.busy==="1")return;const file=$("thumbnailFile").files[0];if(!file){say("Pilih file gambar terlebih dahulu.");$("thumbnailFile").focus();return;}if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){say("Format gambar tidak didukung. Gunakan JPG, PNG, WEBP, atau GIF.");return;}if(file.size>50*1024*1024){say("Ukuran gambar maksimal 50 MB.");return;}const ext=(file.name.split(".").pop()||"webp").toLowerCase().replace(/[^a-z0-9]/g,"")||"webp";const path="articles/"+Date.now()+"-"+slugify(file.name.replace(/\.[^.]+$/,""))+"."+ext;btn.dataset.busy="1";btn.disabled=true;try{say("Mengunggah gambar artikel ke Storage…");const up=await db.storage.from("leo-store-images").upload(path,file,{upsert:false,contentType:file.type});if(up.error)throw up.error;const url=db.storage.from("leo-store-images").getPublicUrl(path).data.publicUrl;$("thumbnail").value=url;showThumbnail(url);say("File terunggah. Menambahkan ke perpustakaan gambar…");const saved=await db.from("store_images").upsert({image_key:"article-"+Date.now(),image_url:url,updated_at:new Date().toISOString()},{onConflict:"image_key"});if(saved.error)throw new Error("File terunggah, tetapi gagal dicatat di perpustakaan: "+saved.error.message);await loadThumbnailLibrary();$("thumbnailPicker").value=url;$("thumbnailFile").value="";say("Berhasil: gambar terunggah, tersimpan di perpustakaan, dan dipilih sebagai thumbnail.");}catch(err){say("Upload gagal: "+(err&&err.message?err.message:String(err)));}finally{btn.disabled=false;delete btn.dataset.busy;}});
})();
