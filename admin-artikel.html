<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Artikel | LEOOSTORE.id</title><link rel="stylesheet" href="css/style.css?v=20261019-articles"><style>body{padding:18px}.adm-wrap{max-width:1100px;margin:auto}.adm-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.adm-panel{padding:20px;border:1px solid #393345;border-radius:16px;margin:18px 0;background:var(--card,#15131d)}.adm-form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.adm-form label{display:flex;flex-direction:column;gap:7px;font-weight:600}.adm-form input,.adm-form select,.adm-form textarea{width:100%;padding:11px;border:1px solid #453b52;border-radius:10px;background:#100e16;color:inherit}.adm-form textarea{min-height:140px;resize:vertical}.adm-full{grid-column:1/-1}.adm-actions{display:flex;gap:9px;flex-wrap:wrap}.adm-btn{padding:11px 15px;border:1px solid #6b55a0;border-radius:10px;background:#6d4bc3;color:white;cursor:pointer}.adm-btn.secondary{background:transparent}.adm-status{padding:12px;border-radius:10px;background:#211c2a;margin:12px 0}.adm-list{display:grid;gap:10px}.adm-item{padding:14px;border:1px solid #393345;border-radius:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.adm-item p{margin:5px 0;opacity:.7}.adm-item-actions{display:flex;gap:7px;flex-wrap:wrap}.adm-small{font-size:13px;opacity:.75}@media(max-width:650px){.adm-form{grid-template-columns:1fr}.adm-full{grid-column:auto}.adm-item{align-items:flex-start;flex-direction:column}}</style></head><body><main class="adm-wrap"><header class="adm-head"><div><a href="index.html">← Kembali ke storefront</a><h1>Kelola Artikel</h1><p class="adm-small">Tulis artikel, simpan sebagai draf, lalu publikasikan ke halaman Artikel.</p></div><button class="adm-btn secondary" id="signOut">Keluar</button></header><div id="status" class="adm-status">Memeriksa sesi admin...</div><section class="adm-panel" id="editor" hidden><h2 id="formTitle">Tambah artikel</h2><form id="articleForm" class="adm-form"><input type="hidden" id="articleId"><label>Judul artikel<input id="title" required maxlength="180" placeholder="Contoh: Tips top up yang aman"></label><label>Slug URL<input id="slug" required pattern="[a-z0-9-]+" placeholder="tips-top-up-aman"><span class="adm-small">Gunakan huruf kecil, angka, dan tanda hubung.</span></label><label>Kategori<select id="category"><option>Tips Top Up</option><option>Berita Game</option><option>Promo</option><option>Jual Beli Akun</option><option>Panduan</option></select></label><label>Status<select id="articleStatus"><option value="draft">Draf</option><option value="published">Publikasikan</option></select></label><label class="adm-full">URL gambar thumbnail (opsional)<input id="thumbnail" type="url" placeholder="https://..."></label><label class="adm-full">Ringkasan<input id="excerpt" maxlength="300" placeholder="Ringkasan singkat yang tampil di daftar artikel"></label><label class="adm-full">Isi artikel<textarea id="content" required placeholder="Tulis isi artikel di sini. Pisahkan paragraf dengan baris kosong."></textarea><span class="adm-small">Teks biasa; HTML tidak diproses sebagai kode.</span></label><div class="adm-full adm-actions"><button class="adm-btn" type="submit">Simpan artikel</button><button class="adm-btn secondary" type="button" id="resetForm">Artikel baru / batal edit</button></div></form></section><section class="adm-panel" id="listPanel" hidden><h2>Daftar artikel</h2><div id="articleList" class="adm-list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient("https://tvdbrqskvuukxvqaqjom.supabase.co","sb_publishable_2f-IadmcnaYzoCb_8Iko0w_pFp9u8eF");const $=id=>document.getElementById(id),status=$("status");let user=null;const say=s=>status.textContent=s;const slugify=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");$("title").addEventListener("input",()=>{if(!$("articleId").value||!$("slug").dataset.touched)$("slug").value=slugify($("title").value)});$("slug").addEventListener("input",()=>{$("slug").dataset.touched="1";$("slug").value=slugify($("slug").value)});function reset(){ $("articleForm").reset();$("articleId").value="";$("slug").dataset.touched="";$("formTitle").textContent="Tambah artikel";} $("resetForm").onclick=reset;async function load(){const {data,error}=await db.from("store_articles").select("*").order("updated_at",{ascending:false});if(error){$("articleList").textContent="Gagal memuat artikel: "+error.message;return;}const rows=data||[];$("articleList").innerHTML=rows.length?rows.map(a=>'<div class="adm-item"><div><strong>'+escapeHtml(a.title)+'</strong><p>'+escapeHtml(a.category)+' · '+escapeHtml(a.status)+' · /artikel-detail.html?slug='+escapeHtml(a.slug)+'</p></div><div class="adm-item-actions"><button class="adm-btn secondary" data-edit="'+a.id+'">Edit</button><button class="adm-btn secondary" data-toggle="'+a.id+'">'+(a.status==="published"?"Jadikan draf":"Publikasikan")+'</button><button class="adm-btn secondary" data-delete="'+a.id+'">Hapus</button></div></div>').join(""):'Belum ada artikel.'}function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));} $("articleForm").onsubmit=async e=>{e.preventDefault();const payload={title:$("title").value.trim(),slug:$("slug").value.trim(),category:$("category").value,status:$("articleStatus").value,thumbnail_url:$("thumbnail").value.trim()||null,excerpt:$("excerpt").value.trim(),content:$("content").value.trim(),updated_at:new Date().toISOString(),author_id:user.id};if(payload.status==="published"&&!payload.published_at)payload.published_at=new Date().toISOString();if($("articleId").value){const {error}=await db.from("store_articles").update(payload).eq("id",$("articleId").value);if(error){say("Gagal menyimpan: "+error.message);return;}}else{payload.published_at=payload.status==="published"?new Date().toISOString():null;const {error}=await db.from("store_articles").insert(payload);if(error){say("Gagal menyimpan: "+error.message);return;}}say("Artikel berhasil disimpan.");reset();await load();};$("articleList").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.edit||b.dataset.toggle||b.dataset.delete;if(!id)return;const {data,error}=await db.from("store_articles").select("*").eq("id",id).single();if(error){say(error.message);return;}if(b.dataset.edit){$("articleId").value=data.id;$("title").value=data.title;$("slug").value=data.slug;$("slug").dataset.touched="1";$("category").value=data.category;$("articleStatus").value=data.status;$("thumbnail").value=data.thumbnail_url||"";$("excerpt").value=data.excerpt||"";$("content").value=data.content||"";$("formTitle").textContent="Edit artikel";window.scrollTo({top:0,behavior:"smooth"});return;}if(b.dataset.delete){if(!confirm("Hapus artikel ini secara permanen?"))return;const {error:delErr}=await db.from("store_articles").delete().eq("id",id);if(delErr){say(delErr.message);return;}say("Artikel dihapus.");await load();return;}const next=data.status==="published"?"draft":"published";const {error:upErr}=await db.from("store_articles").update({status:next,published_at:next==="published"?(data.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()}).eq("id",id);if(upErr){say(upErr.message);return;}say("Status artikel diperbarui.");await load();};$("signOut").onclick=async()=>{await db.auth.signOut();location.href="index.html"};db.auth.getSession().then(async({data,error})=>{if(error||!data.session){say("Silakan login melalui Supabase Auth sebelum mengelola artikel.");return;}user=data.session.user;$("editor").hidden=false;$("listPanel").hidden=false;say("Login sebagai "+(user.email||"admin")+" · jika operasi ditolak, periksa RLS database.");await load();});})();
