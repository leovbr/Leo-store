<script>
document.addEventListener("DOMContentLoaded",function(){
 const menuButton=document.getElementById("menuButton"),menuClose=document.getElementById("menuClose"),sideMenu=document.getElementById("sideMenu"),menuOverlay=document.getElementById("menuOverlay"),searchButton=document.getElementById("searchButton"),searchPanel=document.getElementById("searchPanel"),searchClose=document.getElementById("searchClose"),siteSearch=document.getElementById("siteSearch");
 function openMenu(){if(!sideMenu||!menuOverlay)return;sideMenu.classList.add("active");menuOverlay.classList.add("active");sideMenu.setAttribute("aria-hidden","false");menuButton?.setAttribute("aria-expanded","true");document.body.style.overflow="hidden";}
 function closeMenu(){sideMenu?.classList.remove("active");menuOverlay?.classList.remove("active");sideMenu?.setAttribute("aria-hidden","true");menuButton?.setAttribute("aria-expanded","false");document.body.style.overflow="";}
 menuButton?.addEventListener("click",openMenu);menuClose?.addEventListener("click",closeMenu);menuOverlay?.addEventListener("click",closeMenu);
 document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();searchPanel?.classList.remove("active");}});
 searchButton?.addEventListener("click",()=>{searchPanel.classList.toggle("active");if(searchPanel.classList.contains("active"))siteSearch?.focus();});
 searchClose?.addEventListener("click",()=>{searchPanel.classList.remove("active");if(siteSearch)siteSearch.value="";});
 siteSearch?.addEventListener("keydown",e=>{if(e.key==="Enter"&&siteSearch.value.trim())location.href="shop.html?q="+encodeURIComponent(siteSearch.value.trim());});
});
</script>
