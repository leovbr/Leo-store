<style>
body{background:#080e1a;color:#f4f6ff;font-family:inherit}
.reviews-page{width:min(1100px,calc(100% - 32px));margin:48px auto 70px}
.reviews-heading{margin-bottom:24px}.reviews-heading a{color:#c4b5fd;text-decoration:none}.reviews-heading h1{font-size:clamp(25px,4vw,38px);margin:18px 0 8px}.reviews-heading p{color:#9caac0}
.leo-review-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;margin:20px 0;border:1px solid rgba(148,163,184,.18);border-radius:16px;background:linear-gradient(135deg,rgba(124,92,255,.12),rgba(15,23,42,.45))}

.leo-public-review-card{min-width:0;padding:18px;border:1px solid rgba(148,163,184,.18);border-radius:15px;background:rgba(15,23,42,.75)}
.leo-public-review-card .review-card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.leo-public-review-card strong{font-size:13px;overflow-wrap:anywhere}.leo-public-review-card .review-stars{color:#f6c453;letter-spacing:1px;white-space:nowrap}
.leo-public-review-card p{margin:12px 0 0;color:#cbd5e1;font-size:13px;line-height:1.7;overflow-wrap:anywhere}.leo-public-review-card time{display:block;margin-top:12px;color:#8290a7;font-size:11px}
@media(max-width:760px){.leo-public-review-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.leo-public-review-grid{grid-template-columns:1fr}}
</style>
</head><body>
