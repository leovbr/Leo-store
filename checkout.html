<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout — Leo Store</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>

    <h1>Leo Store</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Top Up</a>
      <a href="order.html">Cek Pesanan</a>
    </nav>

  </header>


  <main>

    <h2>
      Checkout
    </h2>


    <form id="checkoutForm">


      <!-- GAME -->

      <section>

        <h3>
          Produk
        </h3>

        <label for="game">
          Game
        </label>

        <select
          id="game"
          name="game"
          required
        >

          <option value="">
            Pilih Game
          </option>

          <option value="mobile-legends">
            Mobile Legends
          </option>

          <option value="free-fire">
            Free Fire
          </option>

          <option value="roblox">
            Roblox
          </option>

          <option value="pubg-mobile">
            PUBG Mobile
          </option>

        </select>

      </section>


      <!-- PLAYER -->

      <section>

        <h3>
          Data Player
        </h3>


        <label for="playerId">
          User ID / Username
        </label>

        <input
          type="text"
          id="playerId"
          name="playerId"
          placeholder="Masukkan ID / username"
          autocomplete="off"
          required
        >


        <label for="server">
          Server / Zone
        </label>

        <input
          type="text"
          id="server"
          name="server"
          placeholder="Opsional jika tidak diperlukan"
          autocomplete="off"
        >

      </section>


      <!-- NOMINAL -->

      <section>

        <h3>
          Nominal
        </h3>

        <select
          id="nominal"
          name="nominal"
          required
        >

          <option value="">
            Pilih Game Terlebih Dahulu
          </option>

        </select>


        <p
          id="pricePreview"
          style="margin-top: 12px;"
        >
        </p>

      </section>


      <!-- PAYMENT -->

      <section>

        <h3>
          Pembayaran
        </h3>

        <select
          id="payment"
          name="payment"
          required
        >

          <option value="">
            Pilih Metode Pembayaran
          </option>

          <option value="qris">
            QRIS
          </option>

          <option value="ewallet">
            E-Wallet
          </option>

          <option value="bank">
            Virtual Account
          </option>

        </select>

      </section>


      <button type="submit">
        Buat Pesanan
      </button>


    </form>

  </main>


  <footer>

    <p>
      © 2026 Leo Store
    </p>

  </footer>


  <script src="js/products.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
